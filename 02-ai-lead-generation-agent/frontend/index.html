<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGC Lead Agent Demo</title><style>body{font:16px system-ui;max-width:980px;margin:40px auto;padding:0 18px;color:#172033}input,button{padding:10px;margin:5px}button{cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#667085}</style></head><body><h1>AI Lead Generation Agent</h1><p class="muted">Demo UI · Review-first · No automated outreach</p><form id="lead"><input name="company" placeholder="Company" required><input name="email" type="email" placeholder="Email" required><input name="industry" placeholder="Industry"><input name="website" placeholder="https://example.com"><button>Add lead</button></form><button id="refresh">Refresh leads</button> <button id="report">Show report</button><pre id="msg"></pre><table><thead><tr><th>Company</th><th>Email</th><th>Score</th><th>Priority</th><th>Review</th></tr></thead><tbody id="rows"></tbody></table><script>
const api='';const msg=document.querySelector('#msg');
document.querySelector('#lead').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{let r=await fetch('/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');msg.textContent='Created lead #'+j.id;e.target.reset();load()}catch(x){msg.textContent=x.message}};
async function load(){let r=await fetch('/leads');let data=await r.json();document.querySelector('#rows').innerHTML=data.map(x=>`<tr><td>${esc(x.company)}</td><td>${esc(x.email)}</td><td>${x.score}</td><td>${x.priority}</td><td><button onclick="review(${x.id},'qualified')">Qualify</button><button onclick="review(${x.id},'disqualified')">Disqualify</button></td></tr>`).join('')}
window.review=async(id,status)=>{let r=await fetch(`/leads/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});let j=await r.json();msg.textContent=j.message||j.detail;load()};
document.querySelector('#refresh').onclick=load;document.querySelector('#report').onclick=async()=>{let r=await fetch('/reports/summary');msg.textContent=JSON.stringify(await r.json(),null,2)};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
