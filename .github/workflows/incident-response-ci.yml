name: incident-response-ci
on:
  push:
    paths: ['01-ai-devops-incident-response/**', '.github/workflows/incident-response-ci.yml']
  pull_request:
    paths: ['01-ai-devops-incident-response/**', '.github/workflows/incident-response-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-ai-devops-incident-response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 01-ai-devops-incident-response/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
