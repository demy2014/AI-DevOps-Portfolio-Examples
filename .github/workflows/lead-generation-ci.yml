name: lead-generation-ci
on:
  push:
    paths: ['02-ai-lead-generation-agent/**', '.github/workflows/lead-generation-ci.yml']
  pull_request:
    paths: ['02-ai-lead-generation-agent/**', '.github/workflows/lead-generation-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-ai-lead-generation-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 02-ai-lead-generation-agent/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: pytest -q
